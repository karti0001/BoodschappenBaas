name: Aanbiedingen bijwerken

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aanbiedingen-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Haal Reclamefolder-data op
        run: |
          if ! node scripts/update-aanbiedingen.js; then
            echo "Aanbiedingen ophalen mislukt; bestaand JSON-bestand wordt niet overschreven."
            exit 1
          fi
      - name: Commit gewijzigde aanbiedingen
        run: |
          if git diff --quiet -- frontend/data/aanbiedingen.json; then
            echo "Geen wijzigingen in aanbiedingen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/data/aanbiedingen.json
          git commit -m "Update aanbiedingen data"
          git push
