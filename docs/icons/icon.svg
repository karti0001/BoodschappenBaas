  <line x1="138" y1="315" x2="372" y2="315" stroke="#6c63ff" stroke-width="6" opacity="0.3"/>
  <!-- Basket rim -->
  <path d="M130 230 Q130 220 140 220 L372 220 Q382 220 382 230" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Handle left -->
  <path d="M190 220 Q170 140 220 120" fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  <!-- Handle right -->
