  <line x1="196" y1="232" x2="210" y2="368" stroke="#6c63ff" stroke-width="6" opacity="0.3"/>
  <line x1="316" y1="232" x2="302" y2="368" stroke="#6c63ff" stroke-width="6" opacity="0.3"/>
